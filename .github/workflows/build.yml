name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y perl-IPC-Cmd python3.11 python3.11-devel openblas-devel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - name: Run tests
        env:
          PYO3_PYTHON: /usr/bin/python3.11
        run: |
          unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          export PATH="/usr/bin:$HOME/.rustup/toolchains/1.92.0-x86_64-unknown-linux-gnu/bin:$PATH"
          cargo test --release

      - name: Run tests with deadlock detection
        env:
          PYO3_PYTHON: /usr/bin/python3.11
        run: |
          unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          export PATH="/usr/bin:$HOME/.rustup/toolchains/1.92.0-x86_64-unknown-linux-gnu/bin:$PATH"
          cargo test --release --features deadlock-detection

      - name: Lock-order audit
        run: python3.11 tools/lock_order_audit.py

      - name: Build release artifacts
        env:
          PYO3_PYTHON: /usr/bin/python3.11
        run: |
          unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          export PATH="/usr/bin:$HOME/.rustup/toolchains/1.92.0-x86_64-unknown-linux-gnu/bin:$PATH"
          cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p dist/include
          cp target/release/libchitta_field.a dist/
          cp include/chitta_field.h dist/include/
          tar -czvf chitta-field-linux-x64.tar.gz -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-field-linux-x64
          path: chitta-field-linux-x64.tar.gz

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
