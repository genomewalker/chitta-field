[package]
name = "chitta-field"
version = "1.0.3"
edition = "2021"
description = "Organic associative memory substrate for cognitive AI companions"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
rmp-serde = "=1.1.2"
rmp = "=0.8.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
byteorder = "1.5"
crc32fast = "1.4"
memmap2 = "0.9"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "bench"
path = "benches/recall_bench.rs"

[dev-dependencies]
tempfile = "3"
env_logger = "0.10"

[profile.release]
lto = true
codegen-units = 1
